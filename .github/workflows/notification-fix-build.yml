name: Cinny 4.12.7 notification startup fix, updater disabled
on:
  workflow_dispatch:
  push:
    branches: ['build/v4.12.7-pr612']
    paths: ['src-tauri/**', 'scripts/check-notification-bridge.cjs']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - platform: macos-latest
            target: universal-apple-darwin
            name: macos-universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - run: npm ci
      - run: npm ci
        working-directory: cinny
      - name: Verify permission bridge and native plugin setup
        run: node scripts/check-notification-bridge.cjs
      - name: Build release installers with updater disabled
        run: npm run tauri build -- --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - name: Verify release files and prepare build metadata
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, hashlib, datetime, json, shutil
          root = pathlib.Path('src-tauri/target') / os.environ['BUILD_TARGET'] / 'release'
          out = pathlib.Path('release-output'); out.mkdir()
          binary = root / ('cinny.exe' if os.name == 'nt' else 'bundle/macos/Cinny.app/Contents/MacOS/cinny')
          data = binary.read_bytes()
          assert len(data) > 1000000
          for marker in [b'__tauriNotificationPermissionStatus', b'__tauriNotificationPermissionReady', b'plugin:notification|request_permission', b'plugin:notification|notify']:
              assert marker in data, marker
          assert b'Would you like to update now?' not in data, 'Automatic update dialog remains in binary'
          if os.name == 'nt':
              installers = list((root/'bundle/msi').glob('*.msi')) + list((root/'bundle/nsis').glob('*.exe'))
          else:
              installers = list((root/'bundle/dmg').glob('*.dmg'))
              app = root/'bundle/macos/Cinny.app'
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(app), str(out/'Cinny_4.12.7_PR612_startup-fix_no-updater_universal.app.zip')], check=True)
          assert installers
          if os.name == 'nt':
              extraction = pathlib.Path('msi-verification').resolve()
              extraction.mkdir()
              msi = next(file for file in installers if file.suffix == '.msi')
              subprocess.run(['msiexec', '/a', str(msi.resolve()), '/qn', f'TARGETDIR={extraction}'], check=True)
              extracted = list(extraction.rglob('cinny.exe'))
              assert len(extracted) == 1 and extracted[0].read_bytes() == data, 'MSI payload differs from checked application'
          else:
              import struct
              assert data[:4] == bytes.fromhex('cafebabe'), 'Expected universal Mach-O'
              cpus = set()
              for i in range(struct.unpack_from('>I', data, 4)[0]):
                  cpu, subtype, offset, size, align = struct.unpack_from('>IIIII', data, 8+i*20)
                  cpus.add(cpu)
                  part = data[offset:offset+size]
                  assert b'__tauriNotificationPermissionReady' in part, 'Startup fix missing from architecture'
                  assert b'Would you like to update now?' not in part
              assert cpus == {0x01000007, 0x0100000c}, 'Both Intel and Apple Silicon required'
              mount = pathlib.Path('dmg-verification').resolve()
              mount.mkdir()
              dmg = next(file for file in installers if file.suffix == '.dmg')
              subprocess.run(['hdiutil', 'attach', '-nobrowse', '-readonly', '-mountpoint', str(mount), str(dmg.resolve())], check=True, stdout=subprocess.DEVNULL)
              try:
                  assert (mount/'Cinny.app/Contents/MacOS/cinny').read_bytes() == data, 'DMG payload differs from checked application'
              finally:
                  subprocess.run(['hdiutil', 'detach', str(mount)], check=True, stdout=subprocess.DEVNULL)
          for file in installers:
              assert file.stat().st_size > 1000000
              shutil.copy2(file, out/(file.stem + '_PR612_startup-fix_no-updater' + file.suffix))
          try:
              process = subprocess.Popen([str(binary.resolve())], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  code = process.wait(timeout=10)
                  raise RuntimeError(f'Application exited unexpectedly with code {code}')
              except subprocess.TimeoutExpired:
                  process.terminate(); process.wait(timeout=10)
                  smoke = 'Process remained running for 10 seconds on native runner; notification delivery not manually tested.'
          except Exception as error:
              smoke = f'Native startup smoke test failed: {error}'
              raise
          base = 'd3627de8792ff1b3bba74aecbee3a503ce75ad35'
          pr = '9948bf078f6d27e15f1ac9241ec4006059d4f43d'
          info = f'''Cinny Desktop v4.12.7 + PR #612, updater disabled
          Base commit: {base}
          PR commit: {pr}
          Source commit: {subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}
          Build date UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Target: {os.environ['BUILD_TARGET']}
          Signing: No Windows Authenticode / Apple Developer signing or notarization requested; Apple Silicon may have an ad-hoc linker signature.
          Integration: Full original PR merged into stable v4.12.7; corrected default/prompt mapping and initialize native notification permission at every startup so opening Settings or using the console is unnecessary.
          Updater: Official 0001-disable-tauri-updater.patch applied. Default Cargo features exclude updater, compiling out plugin registration, startup check, dialog and automatic installation.
          Validation: Exact previous startup failure reproduced with mocked IPC; cold launch and restart regression tests pass; native MSI/DMG payload verified against checked executable; new startup permission code and no-updater condition verified in both macOS architectures.
          Startup test: {smoke}
          Sound: Original Cinny frontend settings unchanged. Actual native Notify silent/loud behavior requires interactive validation.
          Unsigned macOS: Extract the app and copy to Applications, then Open Anyway in System Settings > Privacy & Security if Gatekeeper blocks it.
          '''
          (out/'BUILD_INFO.txt').write_text(info, encoding='utf-8')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in out.iterdir() if p.is_file()]
          (out/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cinny-4.12.7-pr612-startup-fix-no-updater-${{ matrix.name }}
          path: |
            release-output/*.exe
            release-output/*.msi
            release-output/*.dmg
            release-output/*.txt
          if-no-files-found: error
