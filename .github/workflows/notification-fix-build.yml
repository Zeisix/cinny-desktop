name: Cinny 4.12.7 native startup r2, updater disabled
on:
  workflow_dispatch:
  push:
    branches: ['build/v4.12.7-pr612']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - platform: macos-latest
            target: universal-apple-darwin
            name: macos-universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - run: npm ci
      - run: npm ci
        working-directory: cinny
      - name: Ensure Windows WebView2 runtime is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe", "$env:ProgramFiles\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe")
          $runtimes = Get-Item $paths -ErrorAction SilentlyContinue
          if (-not $runtimes) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-setup.exe
            $setup = Start-Process .\webview2-setup.exe -ArgumentList '/silent /install' -Wait -PassThru
            Write-Output "WebView2 installer result: $($setup.ExitCode)"
          }
          $runtimes = Get-Item $paths -ErrorAction SilentlyContinue
          if (-not $runtimes) { throw 'WebView2 runtime not available after installation' }
          $runtimes | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}}
      - name: Verify permission bridge and native plugin setup
        run: node scripts/check-notification-bridge.cjs
      - name: Build release installers with updater disabled
        run: npm run tauri build -- --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - name: Verify release files and prepare build metadata
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, hashlib, datetime, json, shutil
          root = pathlib.Path('src-tauri/target') / os.environ['BUILD_TARGET'] / 'release'
          out = pathlib.Path('release-output'); out.mkdir()
          binary = root / ('cinny.exe' if os.name == 'nt' else 'bundle/macos/Cinny.app/Contents/MacOS/cinny')
          data = binary.read_bytes()
          assert len(data) > 1000000
          for marker in [b'__tauriNotificationPermissionStatus', b'__tauriNotificationPermissionReady', b'native-startup-r2', b'plugin:notification|request_permission', b'plugin:notification|notify']:
              assert marker in data, marker
          assert b'Would you like to update now?' not in data, 'Automatic update dialog remains in binary'
          if os.name == 'nt':
              installers = list((root/'bundle/msi').glob('*.msi')) + list((root/'bundle/nsis').glob('*.exe'))
          else:
              installers = list((root/'bundle/dmg').glob('*.dmg'))
              app = root/'bundle/macos/Cinny.app'
          assert installers
          if os.name == 'nt':
              extraction = pathlib.Path('msi-verification').resolve()
              extraction.mkdir()
              msi = next(file for file in installers if file.suffix == '.msi')
              subprocess.run(['msiexec', '/a', str(msi.resolve()), '/qn', f'TARGETDIR={extraction}'], check=True)
              extracted = list(extraction.rglob('cinny.exe'))
              assert len(extracted) == 1 and extracted[0].read_bytes() == data, 'MSI payload differs from checked application'
              installed = pathlib.Path('installed-verification').resolve()
              subprocess.run(['msiexec', '/i', str(msi.resolve()), '/qn', '/norestart', f'INSTALLDIR={installed}'], check=True)
              installed_binary = installed/'cinny.exe'
              assert installed_binary.read_bytes() == data, 'Installed MSI binary differs from checked application'
              binary = installed_binary
          else:
              import struct
              assert data[:4] == bytes.fromhex('cafebabe'), 'Expected universal Mach-O'
              cpus = set()
              for i in range(struct.unpack_from('>I', data, 4)[0]):
                  cpu, subtype, offset, size, align = struct.unpack_from('>IIIII', data, 8+i*20)
                  cpus.add(cpu)
                  part = data[offset:offset+size]
                  assert b'native-startup-r2' in part, 'Startup fix missing from architecture'
                  assert b'Would you like to update now?' not in part
              assert cpus == {0x01000007, 0x0100000c}, 'Both Intel and Apple Silicon required'
              mount = pathlib.Path('dmg-verification').resolve()
              mount.mkdir()
              dmg = next(file for file in installers if file.suffix == '.dmg')
              subprocess.run(['hdiutil', 'attach', '-nobrowse', '-readonly', '-mountpoint', str(mount), str(dmg.resolve())], check=True, stdout=subprocess.DEVNULL)
              try:
                  assert (mount/'Cinny.app/Contents/MacOS/cinny').read_bytes() == data, 'DMG payload differs from checked application'
              finally:
                  subprocess.run(['hdiutil', 'detach', str(mount)], check=True, stdout=subprocess.DEVNULL)
          for file in installers:
              assert file.stat().st_size > 1000000
              shutil.copy2(file, out/(file.stem + '_PR612_native-startup-r2_no-updater' + file.suffix))
          reports = []
          for iteration in ['cold', 'restart']:
              report_path = pathlib.Path(f'native-notification-{iteration}.json').resolve()
              environment = dict(os.environ, CINNY_NOTIFICATION_TEST_REPORT=str(report_path))
              process = subprocess.Popen([str(binary.resolve())], env=environment, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              try:
                  import time
                  deadline = time.monotonic() + 60
                  while not report_path.exists() and time.monotonic() < deadline:
                      assert process.poll() is None, 'Application exited before WebView initialized'
                      time.sleep(0.5)
                  if not report_path.exists():
                      native_log = pathlib.Path(str(report_path)+'.native.log')
                      print(native_log.read_text() if native_log.exists() else 'No native startup log', flush=True)
                      print('Application stderr: '+repr(process.stderr.peek(1000)) if process.poll() is not None else 'Application process remains running', flush=True)
                  assert report_path.exists(), 'Native WebView startup did not produce report'
                  report = json.loads(report_path.read_text())
                  assert report['revision'] == 'native-startup-r2', report
                  assert report['className'] == 'TauriNotification', report
                  assert report['permissionBeforeAnyRequest'] == 'granted', report
                  assert report.get('nativeNotifyResolved') is True and 'error' not in report, report
                  reports.append(report)
                  print(json.dumps({'iteration': iteration, 'native_webview': report}), flush=True)
              finally:
                  process.terminate(); process.wait(timeout=10)
                  if os.name == 'nt':
                      subprocess.run(['taskkill', '/F', '/IM', 'cinny.exe', '/T'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(2)
          smoke = 'Real native WebView cold launch and restart: permission granted before any requestPermission; native notification IPC resolved. OS banner visibility not manually verified.'
          base = 'd3627de8792ff1b3bba74aecbee3a503ce75ad35'
          pr = '9948bf078f6d27e15f1ac9241ec4006059d4f43d'
          info = f'''Cinny Desktop v4.12.7 + PR #612, updater disabled
          Base commit: {base}
          PR commit: {pr}
          Source commit: {subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}
          Build date UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Target: {os.environ['BUILD_TARGET']}
          Signing: No Windows Authenticode / Apple Developer signing or notarization requested; Apple Silicon may have an ad-hoc linker signature.
          Integration: Full original PR merged into stable v4.12.7. Native permission is resolved in Rust before the frontend runs, eliminating early IPC/cache dependency; the upstream plugin bootstrap can no longer overwrite the bridge or throw on its permission property. Revision native-startup-r2.
          Updater: Official 0001-disable-tauri-updater.patch applied. Default Cargo features exclude updater, compiling out plugin registration, startup check, dialog and automatic installation.
          Validation: Combined upstream-plugin/bridge startup regression tested (including late Windows permission write); real native WebView cold-launch and restart permission/IPC tests pass; native MSI/DMG payload verified against checked executable; new startup permission code and no-updater condition verified in both macOS architectures.
          Startup test: {smoke}
          Sound: Original Cinny frontend settings unchanged. Actual native Notify silent/loud behavior requires interactive validation.
          Unsigned macOS: Extract the app and copy to Applications, then Open Anyway in System Settings > Privacy & Security if Gatekeeper blocks it.
          '''
          (out/'BUILD_INFO.txt').write_text(info, encoding='utf-8')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in out.iterdir() if p.is_file()]
          (out/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cinny-4.12.7-pr612-native-startup-r2-no-updater-${{ matrix.name }}
          path: |
            release-output/*.exe
            release-output/*.msi
            release-output/*.dmg
            release-output/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-runtime-report-${{ matrix.name }}
          path: |
            native-notification-*.json
            native-notification-*.native.log
          if-no-files-found: warn
